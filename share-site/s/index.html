<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen on Daydreamin</title>
<meta name="description" content="Open this song in Daydreamin, or get the free app.">
<meta property="og:title" content="Listen on Daydreamin">
<meta property="og:description" content="Open this song in Daydreamin, or get the free app.">
<meta name="theme-color" content="#08080D">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff;
         background: radial-gradient(circle at 15% 0, #7a2bff99, transparent 60%), radial-gradient(circle at 100% 100%, #ff3d7799, transparent 60%), #08080d; }
  main { max-width: 360px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 10px; }
  p { margin: 0 0 24px; opacity: .8; }
  a { display: block; padding: 14px 18px; border-radius: 999px; font-weight: 600; text-decoration: none; color: #000; background: #fff; }
  a + a { margin-top: 10px; color: #fff; background: #ffffff24; }
</style>
</head>
<body>
<main>
  <h1>Opening Daydreamin…</h1>
  <p id="note">If you don't have the app yet, we'll take you to the download.</p>
  <a id="open" href="#">Open in Daydreamin</a>
  <a id="get" href="https://github.com/theankitverse/daydreamin-android#-download">Get the app</a>
</main>
<script>
  // Reached only when the app didn't take the link itself: an in-app browser, a computer, or no app.
  var download = "https://github.com/theankitverse/daydreamin-android#-download";
  var params = new URLSearchParams(location.search);
  var v = params.get("v"), q = params.get("q");
  function name(key) { var value = params.get(key); return value ? "&" + key + "=" + encodeURIComponent(value.slice(0, 120)) : ""; }
  var query = v && /^[A-Za-z0-9_-]{11}$/.test(v) ? "v=" + v + name("t") + name("a") : q ? "q=" + encodeURIComponent(q.slice(0, 200)) : "";
  var path = "song" + (query ? "?" + query : "");
  var android = /Android/i.test(navigator.userAgent);
  var target = android
    ? "intent://" + path + "#Intent;scheme=daydreamin;package=com.daydreamin.app;S.browser_fallback_url=" + encodeURIComponent(download) + ";end"
    : "daydreamin://" + path;
  document.getElementById("open").href = target;

  // Tried once the page can be seen: a page opened in a background tab waits its turn.
  var left = false, started = false;
  function attempt() {
    if (started || document.hidden) return;
    started = true;
    function gone() { left = true; }
    window.addEventListener("blur", gone);
    window.addEventListener("pagehide", gone);
    document.addEventListener("visibilitychange", function () { if (document.hidden) gone(); });
    location.href = target;
    // Nothing took the link: this device doesn't have the app.
    setTimeout(function () { if (!left) location.replace(download); }, 1800);
  }
  document.addEventListener("visibilitychange", attempt);
  attempt();
</script>
</body>
</html>
