# Builds the desktop app on each system it runs on, tests it there, and — for a desktop-v* tag —
# publishes the installers as a GitHub release (never marked "Latest": that's the Android app's,
# whose in-app updater reads releases/latest).
name: Desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, key: macos-arm64, package: packageDmg, file: "dmg/*.dmg", ext: dmg }
          - { os: macos-15-intel, key: macos-x64, package: packageDmg, file: "dmg/*.dmg", ext: dmg }
          - { os: windows-latest, key: windows, package: packageMsi, file: "msi/*.msi", ext: msi }
          - { os: ubuntu-22.04, key: linux, package: "packageDeb packageRpm", file: "{deb/*.deb,rpm/*.rpm}", ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The JetBrains Runtime: the app ships with it, for its own title bar (the window buttons in
      # the app's top bar) on Windows and macOS. Its SDK has jpackage and the jmods to build with.
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
          java-package: jdk
          cache: gradle

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == desktop-v* ]]; then v="${GITHUB_REF_NAME#desktop-v}"; else v="1.0.0"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Linux tools (rpm packaging, a session bus for MPRIS, a display)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm dbus dbus-x11 xvfb

      - name: Tests
        shell: bash
        run: |
          chmod +x gradlew
          run="./gradlew :app:desktopTest --info -PdesktopVersion=$VERSION"
          if [ "$RUNNER_OS" = "Linux" ]; then run="dbus-run-session -- xvfb-run -a $run"; fi
          status=0
          $run > test.log 2>&1 || status=$?
          grep -E "\[[a-z]+-test\]|PASSED|FAILED|BUILD" test.log || true
          exit $status

      - name: Package
        shell: bash
        run: ./gradlew createDistributable ${{ matrix.package }} -PdesktopVersion=$VERSION

      # The installed app itself, started on this system with the Java runtime it ships with: it
      # must start, find songs and draw Home and Settings.
      - name: Run the packaged app
        shell: bash
        timeout-minutes: 12
        run: |
          dir=app/build/compose/binaries/main/app
          out="$PWD/snapshots"
          case "$RUNNER_OS" in
            macOS) app=("$(ls -d "$dir"/*.app)/Contents/MacOS/Daydreamin") ;;
            Linux) app=(xvfb-run -a "$(find "$dir" -path "*/bin/*" -type f -perm -u+x | head -1)") ;;
            # A windowed program: Windows discards its console output, so the app writes its log
            # into the snapshot folder (snapshots/app.log) in this mode.
            Windows) out="$(cygpath -w "$PWD/snapshots")"; app=("$(ls "$dir"/*/*.exe | head -1)") ;;
          esac
          echo "starting: ${app[*]}"
          mkdir -p snapshots
          # At most 7 minutes (macOS has no 'timeout' command, so: wait, then stop it).
          "${app[@]}" --snapshot "$out" --quick --onboarded --pages home,settings > snapshots/stdout.log 2>&1 &
          pid=$!
          status=124
          for i in $(seq 1 420); do
            if ! kill -0 $pid 2>/dev/null; then status=0; wait $pid || status=$?; break; fi
            sleep 1
          done
          if [ $status -eq 124 ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              # Still running: picture the screen (an error box from the launcher would show up here).
              powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$i=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; [System.Drawing.Graphics]::FromImage(\$i).CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \$i.Save('snapshots\\screen.png')" || true
            fi
            kill $pid 2>/dev/null || true
          fi
          cp snapshots/app.log run.log 2>/dev/null || cp snapshots/stdout.log run.log 2>/dev/null || touch run.log
          grep -vE "^D/|^E/YtExtract" run.log | tail -40 || true
          if [ $status -ne 0 ]; then echo "::error::the packaged app exited with $status (124: still running after 7 minutes)"; exit 1; fi
          for f in home-desktop settings-desktop; do
            if [ ! -f "snapshots/$f.png" ]; then echo "::error::the packaged app didn't draw $f"; exit 1; fi
          done
          # YouTube sometimes turns away datacenter addresses like this one, so songs loading is reported, not required.
          grep -E "built popular feed|built:" run.log || echo "::warning::Home's songs didn't load on this runner (network?)"

      # The real window, title bar and all, as a picture (Windows and macOS runners have a screen).
      - name: Picture the window
        if: runner.os != 'Linux'
        shell: bash
        timeout-minutes: 3
        run: |
          dir=app/build/compose/binaries/main/app
          shot="$PWD/snapshots/window.png"; data="$PWD/window-data"
          case "$RUNNER_OS" in
            macOS) app="$(ls -d "$dir"/*.app)/Contents/MacOS/Daydreamin" ;;
            Windows) shot="$(cygpath -w "$shot")"; data="$(cygpath -w "$data")"; app="$(ls "$dir"/*/*.exe | head -1)" ;;
          esac
          "$app" --data-dir "$data" --onboarded --window-shot "$shot" > snapshots/window.log 2>&1 &
          pid=$!
          for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          grep -E "I/Window|W/Window" snapshots/window.log || true
          ls -la snapshots/window.png || echo "::warning::no window picture"

      # Windows: the setup wizard in Daydreamin's colours (Inno Setup), alongside the .msi that
      # copies of 1.0 still update with.
      - name: Setup wizard (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $app = Resolve-Path "app\build\compose\binaries\main\app\Daydreamin"
          New-Item -ItemType Directory -Force -Path setup | Out-Null
          & $iscc "/DAppVersion=$env:VERSION" "/DAppDir=$app" "/DOutDir=$PWD\setup" desktop-installer\daydreamin.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem setup

      # macOS: the disk image with Daydreamin's background and a drag-to-Applications arrow. If
      # Finder can't be scripted on the runner, the plain disk image from jpackage is used.
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install create-dmg >/dev/null
          app="$(ls -d app/build/compose/binaries/main/app/*.app)"
          mkdir -p dmg-src branded && cp -R "$app" dmg-src/
          tiffutil -cathidpicheck desktop-installer/dmg-background.png desktop-installer/dmg-background@2x.png -out dmg-background.tiff
          for attempt in 1 2; do
            rm -f branded/Daydreamin.dmg
            create-dmg --volname "Daydreamin" --volicon app/desktop-icons/daydreamin.icns \
              --background dmg-background.tiff --window-pos 200 120 --window-size 660 422 \
              --icon-size 112 --text-size 13 --icon "Daydreamin.app" 180 222 --hide-extension "Daydreamin.app" \
              --app-drop-link 480 222 branded/Daydreamin.dmg dmg-src && break
          done
          ls -la branded || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.key }}
          path: |
            test.log
            run.log
            snapshots/
            app/build/reports/tests/desktopTest/

      - name: Name the installers
        shell: bash
        run: |
          mkdir -p dist
          cd app/build/compose/binaries/main
          case "${{ matrix.key }}" in
            linux)
              cp deb/*.deb "$GITHUB_WORKSPACE/dist/Daydreamin-$VERSION-linux-amd64.deb"
              cp rpm/*.rpm "$GITHUB_WORKSPACE/dist/Daydreamin-$VERSION-linux-x86_64.rpm" ;;
            windows)
              cp msi/*.msi "$GITHUB_WORKSPACE/dist/Daydreamin-$VERSION-windows.msi"
              cp "$GITHUB_WORKSPACE"/setup/Daydreamin-setup.exe "$GITHUB_WORKSPACE/dist/Daydreamin-$VERSION-windows-setup.exe" ;;
            macos-*)
              if [ -f "$GITHUB_WORKSPACE/branded/Daydreamin.dmg" ]; then src="$GITHUB_WORKSPACE/branded/Daydreamin.dmg"; else echo "::warning::plain disk image"; src=$(ls dmg/*.dmg); fi
              cp "$src" "$GITHUB_WORKSPACE/dist/Daydreamin-$VERSION-${{ matrix.key }}.dmg" ;;
            *) cp ${{ matrix.file }} "$GITHUB_WORKSPACE/dist/Daydreamin-$VERSION-${{ matrix.key }}.${{ matrix.ext }}" ;;
          esac
          ls -la "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.key }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ matrix.key }}
          path: snapshots/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Release file and checksums
        run: |
          cd dist
          v="${GITHUB_REF_NAME#desktop-v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sha256sum * > SHA256SUMS.txt
          code=$(echo "$v" | awk -F. '{ print $1*10000 + $2*100 + $3 }')
          entry() { f="Daydreamin-$v-$2"; printf '"%s": {"url": "%s/%s", "size": %s, "sha256": "%s"}' "$1" "$base" "$f" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"; }
          {
            echo "{"
            echo "  \"versionCode\": $code,"
            echo "  \"versionName\": \"$v\","
            echo "  \"url\": \"https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}\","
            echo "  \"notes\": \"Daydreamin $v for your computer.\","
            echo "  \"downloads\": {"
            echo "    $(entry macos-arm64 macos-arm64.dmg),"
            echo "    $(entry macos-x64 macos-x64.dmg),"
            echo "    $(entry windows windows.msi),"
            echo "    $(entry windows-setup windows-setup.exe),"
            echo "    $(entry deb linux-amd64.deb),"
            echo "    $(entry rpm linux-x86_64.rpm)"
            echo "  }"
            echo "}"
          } > desktop-version.json
          cat desktop-version.json
          python3 -m json.tool desktop-version.json > /dev/null

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          cat > notes.md <<NOTES
          **Daydreamin for your computer** — the same app as on your phone: search, Home mixes, lyrics, downloads, crossfade, all of it. No account, no server, no ads.

          | Your computer | Download |
          |---|---|
          | Mac with Apple chip (M1 and later) | \`Daydreamin-$v-macos-arm64.dmg\` |
          | Mac with Intel chip | \`Daydreamin-$v-macos-x64.dmg\` |
          | Windows 10 / 11 | \`Daydreamin-$v-windows-setup.exe\` |
          | Ubuntu, Debian, Mint, Pop!_OS | \`Daydreamin-$v-linux-amd64.deb\` |
          | Fedora, openSUSE | \`Daydreamin-$v-linux-x86_64.rpm\` |

          **Mac:** open the .dmg and drag Daydreamin into Applications. The first time, macOS says it can't check the app — open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** (the app isn't signed with a paid Apple certificate).
          **Windows:** run Daydreamin-$v-windows-setup.exe. If Windows shows "Windows protected your PC", click **More info → Run anyway**. (The .msi is the same app, for copies of Daydreamin 1.0 updating themselves.)
          **Linux:** open the file with your software installer, or \`sudo apt install ./Daydreamin-$v-linux-amd64.deb\` (or \`sudo dnf install ./Daydreamin-$v-linux-x86_64.rpm\`).

          Space plays and pauses, Cmd/Ctrl + ←/→ skip, Shift + ←/→ seek, Cmd/Ctrl + F searches, Esc goes back. Your keyboard's media keys work too. Later updates show up inside the app.

          SHA-256 checksums are in SHA256SUMS.txt.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Daydreamin for Mac, Windows & Linux — $v" --notes-file notes.md

      # The README's permanent links (releases/download/desktop-latest/Daydreamin-windows.msi…).
      - name: Update the always-newest download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/desktop-latest.sh "$GITHUB_REF_NAME"
